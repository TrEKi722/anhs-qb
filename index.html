<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAV Quote Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="floating" id="actions-container" style="display:none;">
        <button id="upload-quote-btn">
            <img src="media/uploadB.svg" alt="Upload Quote">
        </button>
        <button id="create-quote-btn" style="background:#00857D;">
            <img src="media/createB.svg" alt="Create Quote">
        </button>
    </div>
    <div class="floating" id="login-btn-container">
        <button id="login-btn">
            <img src="media/loginB.svg" alt="Login">
        </button>
    </div>
    </div>
    <div id="gallery"></div>
    <div class="modal" id="acnt-modal">
        <div class="modal-content">
            <span class="close" id="acnt-close">&times;</span>
            <h2>Login</h2>
            <form id="login-form">
                <label for="email">Email</label><br>
                <input type="text" id="email" name="email" placeholder="example@example.com"><br>
                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" placeholder="Password"><br><br>
                <input onclick="login(document.getElementById('email').value, document.getElementById('password').value)" type="submit" value="Login">
                <p>Don't have an account? <a href="#" onclick="document.getElementById('login-form').style.display='none'; document.getElementById('signup-form').style.removeProperty('display');" id="show-signup">Sign up here</a></p>
            </form>
            <form id="signup-form" style="display:none;">
                <label for="signup-email">Email</label><br>
                <input type="text" id="signup-email" name="signup-email" placeholder="example@example.com"><br>
                <label for="signup-password">Password</label><br>
                <input type="password" id="signup-password" name="signup-password" placeholder="Password"><br><br>
                <label for="signup-confirm-password">Confirm Password</label><br>
                <input type="password" id="signup-confirm-password" name="signup-confirm-password" placeholder="Confirm Password"><br><br>
                <input onclick="signup(document.getElementById('signup-email').value, document.getElementById('signup-password').value, document.getElementById('signup-confirm-password').value)" type="submit" value="Sign Up">
                <p>Already have an account? <a href="#" onclick="document.getElementById('login-form').style.removeProperty('display'); document.getElementById('signup-form').style.display='none';" id="show-login">Login here</a></p>
            </form>
        </div>
    </div>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
