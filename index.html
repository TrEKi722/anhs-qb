<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAV Quote Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="floating" id="login-btn-container">
        <button id="login-btn">
            <img src="media/loginB.svg" alt="Login" width="24" height="24">
        </button>
    </div>
    <div id="gallery"></div>
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <span class="close" id="login-close">&times;</span>
            <h2>Login</h2>
            <form id="login-form">
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username"><br>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password"><br><br>
                <input type="submit" value="Login">
            </form>
        </div>
    </div>

    <script>
        /* ----------- */
        /* - Gallery - */
        /* ----------- */

        const CDN = "https://cdn.ekinney.com";
        const WORKER = "https://list-cdn-objects.722kinney.workers.dev";
        const PREFIX = "qb/";

        async function loadGallery() {
        const res = await fetch(`${WORKER}/list?prefix=${PREFIX}`);
        const keys = await res.json();
        const gallery = document.getElementById("gallery");

        for (const key of keys) {
            const img = document.createElement("img");
            img.src = `${CDN}/${key}`;
            gallery.appendChild(img);
        }
        }

        loadGallery();
        
        /* ----------- */
        /* -- Modal -- */
        /* ----------- */

        var modal = document.getElementById("login-modal");
        var btn = document.getElementById("login-btn");
        var span = document.getElementsByClassName("close")[0];
        
        btn.onclick = function() {
            modal.style.display = "block";
        }
        
        span.onclick = function() {
            modal.style.display = "none";
        }
        
        window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
        }
        }

    </script>
</body>
</html>
